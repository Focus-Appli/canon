<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // Redirect to index.html for GitHub Pages SPA
  // Renvoie vers l'accueil du dossier de l'appli (ex. /canon/), quelle que soit l'adresse
  var dossier = location.pathname.split('/')[1];
  window.location.replace('/' + (dossier ? dossier + '/' : '') + 'index.html');
</script>
</head>
<body></body>
</html>
